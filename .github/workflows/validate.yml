name: validate

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  skills:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Check install.sh syntax
        run: bash -n install.sh

      - name: Validate SKILL.md files
        run: python3 scripts/validate_skills.py
